name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  debug-apk:
    name: Debug APK (installable for test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # پروژه از Gradle نصب‌شده استفاده می‌کند (نیازی به gradle-wrapper.jar نیست)
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NichMarket-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  release-apk:
    name: Signed release APK (needs signing secrets)
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
      SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        if: env.HAS_KEYSTORE == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > release.keystore

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        run: gradle assembleRelease --stacktrace

      - name: Upload release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NichMarket-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 60
