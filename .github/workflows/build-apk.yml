name: Validate and build Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  debug-apk:
    name: Validate bank and build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate question bank and report roadmap progress
        run: |
          python3 tools/validate_questions.py
          python3 tools/report_question_bank.py
          python3 -m unittest discover -s tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        env:
          MYKET_PUBLIC_KEY: ${{ secrets.MYKET_PUBLIC_KEY }}
        shell: bash
        run: |
          set +e
          ./gradlew assembleMyketDebug assembleBazaarDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/nich-build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E -i '(^e: |error:|FAILURE:|could not|what went wrong|caused by:)' "$RUNNER_TEMP/nich-build.log" | tail -8 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          fi
          exit "$status"
      - name: Build instrumentation test APK
        env:
          MYKET_PUBLIC_KEY: ${{ secrets.MYKET_PUBLIC_KEY }}
        shell: bash
        run: |
          set +e
          ./gradlew assembleMyketDebugAndroidTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/nich-test-build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E -i '(^e: |error:|FAILURE:|could not|what went wrong|caused by:)' "$RUNNER_TEMP/nich-test-build.log" | tail -8 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: NichMarket-Bazaar-debug
          path: app/build/outputs/apk/bazaar/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: NichMarket-debug-apk
          path: app/build/outputs/apk/myket/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  bazaar-coexistence-smoke:
    name: Test independent Bazaar and Myket installs
    needs: debug-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NichMarket-debug-apk
          path: myket-apk
      - uses: actions/download-artifact@v4
        with:
          name: NichMarket-Bazaar-debug
          path: bazaar-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and start both independent applications
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          script: |
            set -e
            adb install myket-apk/*.apk
            adb install bazaar-apk/*.apk
            adb shell pm list packages | grep -Fx 'package:com.parsaapps.nichmarket'
            adb shell pm list packages | grep -Fx 'package:com.parsaapps.nichmarket.bazaar'
            adb shell am start -W -n com.parsaapps.nichmarket/com.parsaapps.nichmarket.MainActivity
            adb shell pidof com.parsaapps.nichmarket
            adb shell am start -W -n com.parsaapps.nichmarket.bazaar/com.parsaapps.nichmarket.MainActivity
            adb shell pidof com.parsaapps.nichmarket.bazaar

  release-preflight:
    name: Verify unsigned release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build unsigned APK and AAB (not for distribution)
        shell: bash
        run: |
          set +e
          ./gradlew assembleMyketRelease bundleMyketRelease assembleBazaarRelease bundleBazaarRelease --stacktrace 2>&1 | tee "$RUNNER_TEMP/nich-release.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E -i '(^e: |error:|FAILURE:|could not|what went wrong|caused by:)' "$RUNNER_TEMP/nich-release.log" | tail -8 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          fi
          exit "$status"

  emulator-validation:
    name: Test Android on emulator
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build release with an ephemeral test key (not for distribution)
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/test-only.keystore
          SIGNING_STORE_PASSWORD: test-only-password
          SIGNING_KEY_ALIAS: test-only
          SIGNING_KEY_PASSWORD: test-only-password
        run: |
          keytool -genkeypair -keystore "$SIGNING_KEYSTORE_PATH" -storepass "$SIGNING_STORE_PASSWORD" -keypass "$SIGNING_KEY_PASSWORD" -alias "$SIGNING_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=Test Only' -noprompt
          ./gradlew assembleMyketRelease --stacktrace
      - name: Run instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          script: |
            adb install app/build/outputs/apk/myket/release/app-myket-release.apk
            adb shell am start -W -n com.parsaapps.nichmarket/.MainActivity
            adb shell pidof com.parsaapps.nichmarket
            adb uninstall com.parsaapps.nichmarket
            ./gradlew connectedMyketDebugAndroidTest --stacktrace
      - name: Check critical test coverage
        run: |
          python3 - <<'PYCODE'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True)
          cases = [case for file in files for case in ET.parse(file).getroot().iter('testcase')]
          required = {
              ('com.parsaapps.nichmarket.FreeExamFlowUiTest', 'freeExamCanBeSavedResumedAndReviewed'),
              ('com.parsaapps.nichmarket.ReleaseConfigurationTest', 'embeddedMyketKeyIsTheRequestedKey'),
              ('com.parsaapps.nichmarket.ExamRecoveryTest', 'savedDraftCanBeReadAfterStoreIsRecreated'),
          }
          executed = {(case.get('classname'), case.get('name')) for case in cases if case.find('skipped') is None}
          missing = required - executed
          if missing:
              raise SystemExit('Critical instrumentation tests missing or skipped: ' + str(missing))
          print(f'Critical flow and persistence tests executed; {len(cases)} test cases reported.')
          PYCODE
      - name: Summarize test failures
        if: failure()
        run: |
          python3 - <<'PYCODE'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              root = ET.parse(path).getroot()
              for case in root.iter('testcase'):
                  for failure in case.findall('failure') + case.findall('error'):
                      text = (failure.text or failure.get('message', 'failure'))[:3000]
                      text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f"::error::{case.get('classname')}.{case.get('name')}: {text}")
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore

  release-apk:
    name: Signed release APK (configured repositories only)
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
      SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      MYKET_PUBLIC_KEY: ${{ secrets.MYKET_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_KEYSTORE == 'true'
      - name: Verify required release configuration
        if: env.HAS_KEYSTORE == 'true'
        run: |
          test -n "$SIGNING_STORE_PASSWORD" && test -n "$SIGNING_KEY_ALIAS" && test -n "$SIGNING_KEY_PASSWORD" || { echo 'Missing signing secret' >&2; exit 1; }
          python3 tools/validate_questions.py
      - uses: actions/setup-java@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_KEYSTORE == 'true'
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$SIGNING_KEYSTORE_PATH"
      - name: Build signed release APK and app bundle
        if: env.HAS_KEYSTORE == 'true'
        run: ./gradlew assembleMyketRelease bundleMyketRelease --stacktrace
      - name: Verify release signature and identifiers
        if: env.HAS_KEYSTORE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          apk=app/build/outputs/apk/myket/release/app-myket-release.apk
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/aapt" dump badging "$apk" | grep -F "package: name='com.parsaapps.nichmarket' versionCode='4' versionName='1.1.2'"
          jarsigner -verify app/build/outputs/bundle/myketRelease/*.aab
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: NichMarket-release-apk
          path: app/build/outputs/apk/myket/release/*.apk
          if-no-files-found: error
          retention-days: 60

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: NichMarket-release-aab
          path: app/build/outputs/bundle/myketRelease/*.aab
          if-no-files-found: error
          retention-days: 60
